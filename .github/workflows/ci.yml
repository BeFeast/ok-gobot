name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Memory retrieval eval
        env:
          OKGOBOT_STORAGE_PATH: ${{ runner.temp }}/ok-gobot-memory-eval.db
        run: go run ./cmd/ok-gobot memory eval
