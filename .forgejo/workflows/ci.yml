name: CI / Security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
      GOOS: linux
      GOARCH: amd64
      GOAMD64: v1
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Go
        uses: https://data.forgejo.org/actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify toolchain and modules
        run: |
          test "$(go env GOOS)" = "linux"
          test "$(go env GOARCH)" = "amd64"
          test "$(go env CGO_ENABLED)" = "1"
          go version
          gcc --version
          go mod verify

      - name: Check formatting and module files
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check generated config schema
        run: go test ./internal/configschema -run TestGenerateMatchesCheckedInSchema -count=1

      - name: Stress ChatGPT auth refresh coordination
        run: go test ./internal/ai -run '^TestChatGPTConcurrentRefreshIsSharedAcrossManagers$' -count=100

      - name: Race-check AI authentication
        run: go test -race ./internal/ai -count=1

      - name: Test
        run: go test ./... -count=1

      - name: Memory retrieval eval
        run: go run ./cmd/ok-gobot memory eval

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: https://data.forgejo.org/actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan repository
        run: |
          "$(go env GOPATH)/bin/gitleaks" detect \
            --config .gitleaks.toml \
            --source . \
            --redact

  vulnerability-scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Go
        uses: https://data.forgejo.org/actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...
